name: Unzip File

on:
  push:
    branches:
      - main  # আপনার মেইন ব্রাঞ্চের নাম দিন

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract ZIP
        run: unzip filename.zip -d ./extracted-folder  # 'filename.zip' এর জায়গায় আপনার জিপ ফাইলের নাম দিন

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Extracted zip file"
          git push
